name: build
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Все модули и оба флейвора app (cloud, local): компиляция, unit-тесты (testCloud*/testLocal*), lint.
      - run: ./gradlew build --stacktrace
      # Две сборки одного приложения: облачная (без :core:ailocal, ≈ 10 МБ) и «Локально» (модель на телефоне, ≈ 35 МБ).
      - name: Release APKs
        run: ./gradlew :app:assembleCloudRelease :app:assembleLocalRelease --stacktrace
      - name: Cloud build has no LiteRT
        run: |
          if ./gradlew -q :app:dependencies --configuration cloudReleaseRuntimeClasspath | grep -i litert; then
            echo "cloud release pulls LiteRT" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/*/release/*.apk
