name: build
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # All modules and both app flavors (cloud, local): compilation, unit tests (testCloud*/testLocal*), lint.
      - run: ./gradlew build --stacktrace
      # Two builds of the same app: cloud (without :core:ailocal, ≈ 10 MB) and «Локально» (on-phone model, ≈ 35 MB).
      - name: Release APKs
        run: ./gradlew :app:assembleCloudRelease :app:assembleLocalRelease --stacktrace
      - name: Cloud build has no LiteRT
        run: |
          if ./gradlew -q :app:dependencies --configuration cloudReleaseRuntimeClasspath | grep -i litert; then
            echo "cloud release pulls LiteRT" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/*/release/*.apk
