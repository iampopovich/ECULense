name: release
# A tag like 0.1.0 (or v0.1.0) → two signed APKs (cloud, local) + SHA256SUMS → a GitHub release draft
# with notes from CHANGELOG.md. Publishing the draft is manual, on the Releases page.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ECU_KEYSTORE_BASE64   — base64 of the .jks with the release key
#   ECU_KEYSTORE_PASSWORD, ECU_KEY_ALIAS, ECU_KEY_PASSWORD
# Without the secrets, APKs are signed with the runner's random debug key and get the -debugkey suffix:
# they can be installed, but a build with the real key cannot be installed over them as an update.
# Re-running for an existing tag: Actions → release → Run workflow (tag). Delete the old draft
# first — GitHub does not find drafts by tag, and a second one will appear next to it.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*", "v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег, например 0.1.0 (перезальёт APK в его черновик)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Tag and version
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        id: key
        env:
          ECU_KEYSTORE_BASE64: ${{ secrets.ECU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ECU_KEYSTORE_BASE64" ]; then
            echo "$ECU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ECU_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ECU_KEYSTORE_BASE64 не задан — APK подписаны отладочным ключом (-debugkey)"
            echo "suffix=-debugkey" >> "$GITHUB_OUTPUT"
          fi

      - name: Protocol tests
        run: ./gradlew :core:obd:test --stacktrace

      - name: Build APKs
        env:
          ECU_KEYSTORE_PASSWORD: ${{ secrets.ECU_KEYSTORE_PASSWORD }}
          ECU_KEY_ALIAS: ${{ secrets.ECU_KEY_ALIAS }}
          ECU_KEY_PASSWORD: ${{ secrets.ECU_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleCloudRelease :app:assembleLocalRelease --stacktrace
          -Pecu.versionName=${{ steps.v.outputs.version }}
          -Pecu.versionCode=${{ steps.v.outputs.code }}

      - name: Cloud build has no LiteRT
        run: |
          if ./gradlew -q :app:dependencies --configuration cloudReleaseRuntimeClasspath | grep -i litert; then
            echo "cloud release pulls LiteRT" >&2; exit 1
          fi

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SUFFIX: ${{ steps.key.outputs.suffix }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/cloud/release/app-cloud-release.apk "dist/ECULense-$VERSION-cloud$SUFFIX.apk"
          cp app/build/outputs/apk/local/release/app-local-release.apk "dist/ECULense-$VERSION-local$SUFFIX.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SUFFIX: ${{ steps.key.outputs.suffix }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "В CHANGELOG.md нет раздела [$VERSION]" >&2; exit 1; fi
          {
            echo
            echo "### Файлы"
            echo "- \`ECULense-$VERSION-cloud$SUFFIX.apk\` — облачные ИИ-провайдеры (≈ 10 МБ)"
            echo "- \`ECULense-$VERSION-local$SUFFIX.apk\` — плюс модели на телефоне (≈ 35 МБ)"
            echo "- \`SHA256SUMS\` — контрольные суммы"
            if [ -n "$SUFFIX" ]; then
              echo
              echo "> Внимание: эти APK подписаны временным ключом, следующие версии не установятся поверх них без удаления приложения."
            fi
          } >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ECULense ${{ steps.v.outputs.version }}
          body_path: notes.md
          draft: true
          prerelease: ${{ steps.v.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
